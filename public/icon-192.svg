<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Background Circle -->
  <circle cx="96" cy="96" r="96" fill="#0f172a"/>
  
  <!-- Piggy Bank Body -->
  <ellipse cx="96" cy="105" rx="52" ry="41" fill="#10b981" opacity="0.9"/>
  
  <!-- Piggy Bank Shine/Highlight -->
  <ellipse cx="82" cy="94" rx="15" ry="11" fill="#34d399" opacity="0.6"/>
  
  <!-- Coin Slot on top -->
  <rect x="88" y="71" width="15" height="3" rx="1.5" fill="#0f172a"/>
  
  <!-- Coin going into slot -->
  <g transform="translate(96, 60)">
    <circle cx="0" cy="0" r="9" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="7" fill="#f59e0b"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">$</text>
  </g>
  
  <!-- Motion lines -->
  <line x1="86" y1="52" x2="82" y2="56" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="106" y1="52" x2="110" y2="56" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Piggy Ear -->
  <ellipse cx="67" cy="90" rx="7.5" ry="13" fill="#059669" transform="rotate(-20 67 90)"/>
  
  <!-- Piggy Snout -->
  <ellipse cx="142" cy="105" rx="13" ry="11" fill="#059669"/>
  <circle cx="138" cy="103" r="2.2" fill="#0f172a"/>
  <circle cx="138" cy="109" r="2.2" fill="#0f172a"/>
  
  <!-- Piggy Eye -->
  <circle cx="112" cy="94" r="4.5" fill="#0f172a"/>
  <circle cx="113.5" cy="92.5" r="1.8" fill="#ffffff"/>
  
  <!-- Piggy Legs -->
  <rect x="75" y="135" width="9" height="15" rx="4.5" fill="#059669"/>
  <rect x="97" y="135" width="9" height="15" rx="4.5" fill="#059669"/>
  <rect x="107" y="135" width="9" height="15" rx="4.5" fill="#059669"/>
  
  <!-- Piggy Tail -->
  <path d="M 52 109 Q 45 105, 41 109 T 35 112" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Sparkles -->
  <circle cx="82" cy="49" r="1.2" fill="#fbbf24"/>
  <circle cx="110" cy="47" r="1.2" fill="#fbbf24"/>
  <circle cx="90" cy="43" r="0.8" fill="#fbbf24"/>
  <circle cx="103" cy="45" r="0.8" fill="#fbbf24"/>
</svg>
