<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#0f172a"/>
  
  <!-- Piggy Bank Body -->
  <ellipse cx="256" cy="280" rx="140" ry="110" fill="#10b981" opacity="0.9"/>
  
  <!-- Piggy Bank Shine/Highlight -->
  <ellipse cx="220" cy="250" rx="40" ry="30" fill="#34d399" opacity="0.6"/>
  
  <!-- Coin Slot on top -->
  <rect x="236" y="190" width="40" height="8" rx="4" fill="#0f172a"/>
  
  <!-- Coin going into slot -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="24" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="18" fill="#f59e0b"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">$</text>
  </g>
  
  <!-- Motion lines (showing coin dropping) -->
  <line x1="230" y1="140" x2="220" y2="150" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="282" y1="140" x2="292" y2="150" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Piggy Ear -->
  <ellipse cx="180" cy="240" rx="20" ry="35" fill="#059669" transform="rotate(-20 180 240)"/>
  
  <!-- Piggy Snout -->
  <ellipse cx="380" cy="280" rx="35" ry="30" fill="#059669"/>
  <circle cx="370" cy="275" r="6" fill="#0f172a"/>
  <circle cx="370" cy="290" r="6" fill="#0f172a"/>
  
  <!-- Piggy Eye -->
  <circle cx="300" cy="250" r="12" fill="#0f172a"/>
  <circle cx="303" cy="247" r="5" fill="#ffffff"/>
  
  <!-- Piggy Legs -->
  <rect x="200" y="360" width="25" height="40" rx="12" fill="#059669"/>
  <rect x="260" y="360" width="25" height="40" rx="12" fill="#059669"/>
  <rect x="287" y="360" width="25" height="40" rx="12" fill="#059669"/>
  
  <!-- Piggy Tail (curly) -->
  <path d="M 140 290 Q 120 280, 110 290 T 95 300" stroke="#059669" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Sparkle effects around coin -->
  <circle cx="220" cy="130" r="3" fill="#fbbf24"/>
  <circle cx="295" cy="125" r="3" fill="#fbbf24"/>
  <circle cx="240" cy="115" r="2" fill="#fbbf24"/>
  <circle cx="275" cy="120" r="2" fill="#fbbf24"/>
</svg>
